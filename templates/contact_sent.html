<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Message Sent</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <section style="min-height: 100vh; display: flex; justify-content: center; align-items: center; text-align:center; flex-direction:column; color:#fff;">
    
    <h1 style="font-size:2.5rem; margin-bottom:1rem;">
      Thanks, {{ name }}!
    </h1>

    <p style="font-size:1.2rem; opacity:0.8; max-width:500px; line-height:1.6;">
      Your message has been received.  
      I’ll get back to you as soon as I can. ☕❤️
    </p>

    <a href="{{ url_for('index') }}" 
       style="margin-top:2.5rem; padding:0.8rem 2rem; border-radius:6px;
              background:#6bbbc3; color:#000; text-decoration:none; font-weight:bold;">
      Back to Home
    </a>
  </section>
</body>
</html>
